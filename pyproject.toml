[project]
name = "slam_playground"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = ["numpy"]

[dependency-groups]
dev = ["pytest>=7,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src/slam_playground/test"]
markers = [
    "copyright: checks source-file copyright notices",
    "flake8: checks PEP 8 style with ament_flake8",
    "linter: marks ROS 2 ament lint tests",
    "pep257: checks docstrings with ament_pep257",
]
